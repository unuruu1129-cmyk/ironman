<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="main">
      <div
        class="orbit"
        style="--cyrcle-size: 125px; --cyrcle-border: solid 1px #64b5ea;
        --bg-color: white;"
      ></div>
      <div
        class="orbit-dashed"
        style="
          --cyrcle-size: 150px;
          --cyrcle-period: 5s;
          --cyrcle-border: dashed 10px #64b5ea;
        "
      ></div>
      <div
        class="orbit-dashed"
        style="
          --cyrcle-size: 240px;
          --cyrcle-period: 5s;
          --cyrcle-border: dashed 15px #64b5ea;
        "
      ></div>
      <div
        class="orbit"
        style="--cyrcle-size: 250px; --cyrcle-border: solid 1px #64b5ea;
        --bg-color: none;"
      ></div>
      <div
        class="orbit-dashed"
        style="
          --cyrcle-size: 350px;
          --cyrcle-period: 5s;
          --cyrcle-border: dashed 25px #64b5ea;
        "
      ></div>
      <div
        class="orbit"
        style="--cyrcle-size: 400px; --cyrcle-border: solid 1px #64b5ea;
        --bg-color: none;"
      ></div>
    </div>
  </body>
</html>
